name: Build Windows binaries

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  # x64 Windows build via MSYS2. 32-bit is handled by the win32-cross job below,
  # because MSYS2 no longer ships a working 32-bit toolchain — its MINGW32 target
  # silently produced x86-64 binaries.
  msys:
    runs-on: windows-2022
    strategy:
      matrix:
        mingw: ["MINGW64"]
        include:
          - mingw: "MINGW64"
            package: "mingw-w64-x86_64"
    defaults:
      run:
        shell: bash.exe --login -eo pipefail "{0}"
    env:
      MSYSTEM: ${{ matrix.mingw }}
      CHERE_INVOKING: 1
    name: MSYS2 ${{ matrix.mingw }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up shell
        run: echo "C:\msys64\usr\bin\" >> $GITHUB_PATH
        shell: pwsh

      - name: Install MinGW requirements
        run: |
          echo "$GITHUB_WORKSPACE"
          #pacman -S --noconfirm ${{ matrix.package }}-zlib-devel
          # build the project

      - name: Build binaries
        run: |
          make

      # The architecture is asserted, not just printed: the MINGW32 leg used to
      # produce x86-64 binaries under a 32-bit name and nothing noticed.
      - name: Check the binaries are 64-bit
        run: |
          file ps2vmc-tool.exe ps1vmc-tool.exe
          for f in ps2vmc-tool.exe ps1vmc-tool.exe; do
            file "$f" | grep -q "PE32+ executable" && file "$f" | grep -q "x86-64" || {
              echo "::error::$f is not a 64-bit PE: $(file -b "$f")"; exit 1; }
          done

      # This job runs on Windows, so the binaries it just built can actually be
      # run. Every check below reads real output: a command that fails, or
      # succeeds while printing the wrong thing, fails the build.
      - name: Smoke test the binaries
        run: |
          set -eo pipefail

          # card info and listing
          ./ps2vmc-tool.exe samples/ps2card.vmc --mc-info | grep -q "MC size:    8 MB"
          ./ps2vmc-tool.exe samples/ps2card.vmc --list / | grep -q "BESLES-50325"

          # export a save, then read it back into a freshly formatted card
          cp samples/ps2card.vmc smoke.vmc
          ./ps2vmc-tool.exe samples/ps2card.vmc --psu-export /BESLES-50325 smoke.psu
          ./ps2vmc-tool.exe smoke.vmc --mc-format
          ./ps2vmc-tool.exe smoke.vmc --import smoke.psu | grep -q "PAYNE.ICO"
          ./ps2vmc-tool.exe smoke.vmc --list /BESLES-50325 | grep -q "PAYNE.ICO"

          # the same for the .xps we write ourselves
          ./ps2vmc-tool.exe samples/ps2card.vmc --xps-export /BESLES-50325 smoke.xps
          cp samples/ps2card.vmc xps.vmc
          ./ps2vmc-tool.exe xps.vmc --mc-format
          ./ps2vmc-tool.exe xps.vmc --import smoke.xps | grep -q "PAYNE.ICO"

          # every third-party container, each onto its own blank card so the
          # ones holding the same save cannot collide
          for c in samples/*.cbs samples/*.max samples/*.xps; do
            cp samples/ps2card.vmc one.vmc
            ./ps2vmc-tool.exe one.vmc --mc-format
            ./ps2vmc-tool.exe one.vmc --import "$c" | grep -q "Adding"
            echo "  imported $c"
          done

          # the PS1 tool
          ./ps1vmc-tool.exe samples/epsxe000.mcr --mc-info | grep -q "Data slots: 15"
          ./ps1vmc-tool.exe samples/epsxe000.mcr --list | grep -q "SLUS-01251"

          rm -f smoke.vmc smoke.psu smoke.xps xps.vmc one.vmc
          echo "smoke tests passed"

      - name: Get short SHA
        run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Compress output
        run: |
          tar -zcvf build.tar.gz ps2vmc-tool.exe ps1vmc-tool.exe

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.sha_name }}-${{matrix.mingw}}
          path: build.tar.gz

  # Genuine 32-bit (x86) Windows build, cross-compiled on Linux with mingw-w64,
  # since MSYS2 no longer provides a working 32-bit toolchain.
  win32-cross:
    runs-on: ubuntu-latest
    name: Windows x86 (Linux cross)
    env:
      TC: i686-w64-mingw32
    steps:
      - uses: actions/checkout@v4

      - name: Install i686 mingw cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      # EXE is set explicitly: the Makefile only appends .exe when $(OS) says
      # Windows_NT, which it does not on the Linux runner.
      - name: Build binaries
        run: |
          make CC=${TC}-gcc EXE=.exe

      # "PE32 executable" matches only 32-bit: a 64-bit one reads "PE32+".
      - name: Check the binaries are 32-bit x86
        run: |
          file ps2vmc-tool.exe ps1vmc-tool.exe
          for f in ps2vmc-tool.exe ps1vmc-tool.exe; do
            file "$f" | grep -q "PE32 executable" && file "$f" | grep -q "80386" || {
              echo "::error::$f is not a 32-bit x86 PE: $(file -b "$f")"; exit 1; }
          done

      - name: Get short SHA
        run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Compress output
        run: |
          tar -zcvf build.tar.gz ps2vmc-tool.exe ps1vmc-tool.exe

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.sha_name }}-win32
          path: build.tar.gz
