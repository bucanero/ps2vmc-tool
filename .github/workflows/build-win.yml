name: Build Windows binaries

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  # Both Windows binaries are cross-compiled on Linux with mingw-w64.
  #
  # MSYS2 is deliberately not used. Its MINGW32 target silently produced
  # x86-64 binaries under a 32-bit name, which is what started this, and the
  # package database on the runner image is not a dependable place to get zlib
  # from. apt is: libz-mingw-w64-dev carries zlib for both mingw targets, so
  # one mechanism now covers both architectures.
  #
  # These jobs only check that the binaries built and are the right shape. The
  # functional smoke test lives in build.yml, which produces native binaries
  # the runner can actually execute.
  cross:
    runs-on: ubuntu-latest
    name: Windows ${{ matrix.arch }} (Linux cross)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            tc: x86_64-w64-mingw32
            gcc: gcc-mingw-w64-x86-64
            pe: "PE32+ executable"
            machine: x86-64
          - arch: x86
            tc: i686-w64-mingw32
            gcc: gcc-mingw-w64-i686
            pe: "PE32 executable"
            machine: "80386"
    steps:
      - uses: actions/checkout@v4

      - name: Install the mingw cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.gcc }} libz-mingw-w64-dev

      # EXE is set explicitly: the Makefile only appends .exe when $(OS) says
      # Windows_NT, which it does not on the Linux runner. -l:libz.a picks the
      # static archive over the import library, so the .exe needs no zlib1.dll.
      - name: Build binaries
        run: |
          make CC=${{ matrix.tc }}-gcc EXE=.exe PS2_LIBS=-l:libz.a

      # The architecture is asserted, not just printed: the MSYS2 leg used to
      # produce x86-64 binaries under a 32-bit name and nothing noticed.
      # "PE32 executable" matches only 32-bit; a 64-bit one reads "PE32+".
      - name: Check the binaries are ${{ matrix.arch }}
        run: |
          file ps2vmc-tool.exe ps1vmc-tool.exe
          for f in ps2vmc-tool.exe ps1vmc-tool.exe; do
            file "$f" | grep -q "${{ matrix.pe }}" &&
            file "$f" | grep -q "${{ matrix.machine }}" || {
              echo "::error::$f is not ${{ matrix.arch }}: $(file -b "$f")"; exit 1; }
          done

      # An artifact that needs a DLL we do not ship is broken for whoever
      # downloads it, and nothing else here would notice.
      - name: Check zlib is linked statically
        run: |
          for f in ps2vmc-tool.exe ps1vmc-tool.exe; do
            if ${{ matrix.tc }}-objdump -p "$f" | grep -i "DLL Name" | grep -qi "zlib"; then
              echo "::error::$f depends on a zlib DLL"; exit 1
            fi
          done
          echo "no zlib DLL dependency"

      - name: Get short SHA
        run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.sha_name }}-win-${{ matrix.arch }}
          path: |
            ps1vmc-tool.exe
            ps2vmc-tool.exe
