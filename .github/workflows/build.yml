name: Build binaries

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    
    # zlib is the only dependency: the PS2 tool deflates and inflates .cbs
    # bodies. The runner image already carries it, but say so explicitly so a
    # future image that drops it fails here rather than at the link step.
    - name: Install Ubuntu requirements
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get -y install zlib1g-dev
    
    # macOS gets zlib from the SDK, so there is nothing to install.
    - name: Install macOS requirements
      if: matrix.os == 'macos-latest'
      run: |
        echo "No requirements"

    - name: Runs all the stages in the shell
      run: |
        make

    # These binaries are native, so the runner can actually execute them: the
    # Windows jobs cross-compile, so they can only inspect what they produce.
    # Every check below reads real output, so a command that fails, or that
    # succeeds while printing the wrong thing, fails the build.
    - name: Smoke test the binaries
      run: |
        set -eo pipefail

        # card info and listing
        ./ps2vmc-tool samples/ps2card.vmc --mc-info | grep -q "MC size:    8 MB"
        ./ps2vmc-tool samples/ps2card.vmc --list / | grep -q "BESLES-50325"

        # a card built from nothing is a real 8 MB card, and holds no saves
        ./ps2vmc-tool new.vmc --mc-create
        ./ps2vmc-tool new.vmc --mc-info | grep -q "MC size:    8 MB"
        if ./ps2vmc-tool new.vmc --list / | grep "<dir>" | grep -qE "^[A-Za-z]"; then
          echo "::error::a freshly created card already holds a save"; exit 1
        fi

        # formatting an existing card has to wipe the saves off it
        cp samples/ps2card.vmc fmt.vmc
        ./ps2vmc-tool fmt.vmc --mc-format
        if ./ps2vmc-tool fmt.vmc --list / | grep "<dir>" | grep -qE "^[A-Za-z]"; then
          echo "::error::--mc-format left a save behind"; exit 1
        fi

        # export a save, then read it back into the card just created
        ./ps2vmc-tool samples/ps2card.vmc --psu-export /BESLES-50325 smoke.psu
        ./ps2vmc-tool new.vmc --import smoke.psu | grep -q "PAYNE.ICO"
        ./ps2vmc-tool new.vmc --list /BESLES-50325 | grep -q "PAYNE.ICO"

        # the same for the two containers we write ourselves. Byte-identity
        # with the original is checked by web-ps2/test/savefmt.js; here it is
        # enough that what we write comes back as the save that went in.
        for fmt in xps cbs max; do
          ./ps2vmc-tool samples/ps2card.vmc --$fmt-export /BESLES-50325 smoke.$fmt
          ./ps2vmc-tool round.vmc --mc-create
          ./ps2vmc-tool round.vmc --import smoke.$fmt | grep -q "PAYNE.ICO"
          ./ps2vmc-tool round.vmc --list /BESLES-50325 | grep -q "PAYNE.ICO"
          echo "  round-tripped .$fmt"
        done

        # every third-party container, each onto its own blank card so the
        # ones holding the same save cannot collide
        for c in samples/*.cbs samples/*.max samples/*.xps; do
          ./ps2vmc-tool one.vmc --mc-create
          ./ps2vmc-tool one.vmc --import "$c" | grep -q "Adding"
          # the save has to land on the card, not merely parse
          ./ps2vmc-tool one.vmc --list / | grep "<dir>" | grep -qE "^[A-Za-z]"
          echo "  imported $c"
        done

        # the PS1 tool, including a card of its own
        ./ps1vmc-tool samples/epsxe000.mcr --mc-info | grep -q "Data slots: 15"
        ./ps1vmc-tool samples/epsxe000.mcr --list | grep -q "SLUS-01251"
        ./ps1vmc-tool new.mcr --mc-create
        ./ps1vmc-tool new.mcr --mc-info | grep -q "Data slots: 15"

        # A raw save has no header, so its name comes from the file name - and
        # that name is the region, product code and identifier. Importing the
        # same save under three shapes of path has to give the same result;
        # only looking for "/" used to put a Windows path into the name field.
        ./ps1vmc-tool samples/epsxe000.mcr --extract-save 0 BASLUS-0125100000-00
        mkdir -p ps1sub
        cp BASLUS-0125100000-00 ps1sub/
        cp BASLUS-0125100000-00 'C:\saves\BASLUS-0125100000-00'
        cp BASLUS-0125100000-00 BASLUS-0125100000-00.raw
        for f in "BASLUS-0125100000-00" "ps1sub/BASLUS-0125100000-00" \
                 'C:\saves\BASLUS-0125100000-00' "BASLUS-0125100000-00.raw"; do
          ./ps1vmc-tool imp.mcr --mc-create >/dev/null
          ./ps1vmc-tool imp.mcr --inject-save "$f" >/dev/null
          ./ps1vmc-tool imp.mcr --list | grep -q "SLUS-01251" || {
            echo "::error::importing '$f' did not set the product code"
            ./ps1vmc-tool imp.mcr --list; exit 1; }
        done
        echo "  raw import keeps its name across path shapes"

        # A 20-character name hides a bad extension, because the copy into the
        # 20-byte name field truncates it anyway. A short one does not.
        cp BASLUS-0125100000-00 SHORTNAME.raw
        ./ps1vmc-tool ext.mcr --mc-create >/dev/null
        ./ps1vmc-tool ext.mcr --inject-save SHORTNAME.raw >/dev/null
        ./ps1vmc-tool ext.mcr --list | grep -q "SHORTNAME.raw" && {
          echo "::error::the .raw extension leaked into the save name"
          ./ps1vmc-tool ext.mcr --list; exit 1; }
        ./ps1vmc-tool ext.mcr --list | grep -q "SHORTNAME" || {
          echo "::error::the save name was lost"; exit 1; }
        echo "  a .raw extension is stripped from the name"

        # A deleted save keeps its name and data and must not read as a link.
        cp samples/epsxe000.mcr del.mcr
        python3 - <<'PYEOF'
        d = bytearray(open("del.mcr", "rb").read())
        d[128] = 0xA1                      # slot 0: initial, deleted
        x = 0
        for i in range(128, 255):
            x ^= d[i]
        d[255] = x                         # directory frame checksum
        open("del.mcr", "wb").write(bytes(d))
        PYEOF
        ./ps1vmc-tool del.mcr --list | grep -q "<deleted>" || {
          echo "::error::a deleted save is not reported as deleted"
          ./ps1vmc-tool del.mcr --list; exit 1; }
        echo "  deleted saves are reported as deleted"

        rm -rf ps1sub 'C:\saves\BASLUS-0125100000-00' BASLUS-0125100000-00 \
               BASLUS-0125100000-00.raw SHORTNAME.raw imp.mcr ext.mcr del.mcr

        rm -f smoke.psu smoke.xps smoke.cbs smoke.max new.vmc round.vmc one.vmc fmt.vmc new.mcr
        echo "smoke tests passed"

    - name: Get short SHA
      run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ env.sha_name }}-${{matrix.os}}
        path: |
          ps1vmc-tool
          ps2vmc-tool
